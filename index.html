<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundial 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:#050816;
--panel:#091127;
--card:#111b35;
--card2:#0a1227;
--accent:#39ff88;
--text:#ffffff;
--muted:#a0a0a0;
--border:rgba(255,255,255,.08);
}

body{
font-family:'Poppins',sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
min-height:100vh;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#0f2a68 0%,transparent 30%),
radial-gradient(circle at bottom right,#072b18 0%,transparent 30%);
opacity:.7;
z-index:-1;
}

.header{
height:90px;
display:flex;
align-items:center;
padding:0 40px;
background:rgba(0,0,0,.25);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--border);
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo h1{
font-size:2rem;
}

.logo span{
color:var(--accent);
}

.main{
display:flex;
}

.sidebar{
width:280px;
background:#071020;
padding:25px 20px;
height:calc(100vh - 90px);
overflow-y:auto;
border-right:1px solid var(--border);
}

.sidebar-title{
font-size:1rem;
margin-bottom:20px;
color:#9aa7c7;
}

.group-btn{
background:#0d1734;
padding:15px;
border-radius:16px;
margin-bottom:14px;
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
transition:.2s;
font-weight:600;
border:1px solid rgba(255,255,255,.05);
}

.group-btn:hover{
transform:translateX(5px);
border-color:var(--accent);
}

.group-btn.active{
background:linear-gradient(90deg,#10351d,#133f26);
border-color:var(--accent);
}

.group-circle{
width:34px;
height:34px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.content{
flex:1;
padding:35px;
overflow-x:auto;
}

.panel{
background:rgba(9,17,39,.92);
padding:35px;
border-radius:28px;
}

.group-title{
font-size:3rem;
margin-bottom:25px;
color:var(--accent);
}

.group-teams{
display:flex;
flex-wrap:wrap;
gap:20px;
margin-bottom:35px;
}

.team-chip{
display:flex;
align-items:center;
gap:10px;
background:#101933;
padding:12px 16px;
border-radius:14px;
}

.flag{
width:34px;
height:24px;
object-fit:cover;
border-radius:4px;
}

.top-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.card{
background:var(--card);
padding:25px;
border-radius:22px;
}

.section-title{
font-size:1.4rem;
margin-bottom:20px;
}

.match{
background:var(--card2);
border-radius:16px;
padding:14px;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
}

.team{
width:190px;
display:flex;
align-items:center;
gap:10px;
}

.score-box{
display:flex;
align-items:center;
gap:10px;
}

.match-input{
width:58px;
height:44px;
background:#081020;
border:2px solid #1c325e;
border-radius:12px;
color:white;
font-size:1rem;
text-align:center;
}

.match-input:focus{
outline:none;
border-color:var(--accent);
}

.vs{
font-weight:700;
}

.table{
width:100%;
border-collapse:collapse;
}

.table thead{
background:#16233f;
}

.table th{
padding:14px;
}

.table td{
padding:16px 10px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.05);
}

.table-team{
display:flex;
align-items:center;
gap:10px;
}

.qualify{
border-left:4px solid #39ff88;
}

.third{
border-left:4px solid #5fa8ff;
}

.bracket-container{
margin-top:60px;
display:flex;
gap:28px;
overflow-x:auto;
padding-bottom:40px;
}

.round{
display:flex;
flex-direction:column;
gap:22px;
min-width:240px;
}

.round-title{
text-align:center;
color:#8ca0c9;
margin-bottom:6px;
}

.bracket-match{
background:#111b35;
border-radius:18px;
padding:14px;
}

.bracket-match-title{
margin-bottom:12px;
color:#5cff7f;
text-align:center;
font-weight:600;
}

.bracket-team{
background:#0a1227;
padding:10px;
border-radius:12px;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:8px;
}

.bracket-score{
width:44px;
height:34px;
background:#081020;
border:none;
border-radius:8px;
color:white;
text-align:center;
}

.center-stage{
display:flex;
flex-direction:column;
justify-content:center;
gap:45px;
margin-top:120px;
}

.final-box{
background:#111b35;
padding:22px;
border-radius:20px;
min-width:260px;
}

.final-title{
text-align:center;
margin-bottom:16px;
font-weight:700;
color:var(--accent);
}

@media(max-width:1000px){

.top-grid{
grid-template-columns:1fr;
}

.main{
flex-direction:column;
}

.sidebar{
width:100%;
height:auto;
}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">

<div style="font-size:3rem;">🏆</div>

<div>
<h1>MUNDIAL <span>2026</span></h1>
<div>FASE DE GRUPOS</div>
</div>

</div>

</div>

<div class="main">

<div class="sidebar">

<div class="sidebar-title">
GRUPOS
</div>

<div id="groups-menu"></div>

</div>

<div class="content">

<div class="panel">

<div class="group-title"></div>

<div class="group-teams"></div>

<div class="top-grid">

<div class="card">

<div class="section-title">
⚽ PARTIDOS
</div>

<div id="matches"></div>

</div>

<div class="card">

<div class="section-title">
📊 TABLA
</div>

<table class="table">

<thead>

<tr>
<th>#</th>
<th>Equipo</th>
<th>PTS</th>
<th>GF</th>
<th>GC</th>
<th>DG</th>
</tr>

</thead>

<tbody id="table-body"></tbody>

</table>

</div>

</div>

<div class="bracket-container">

<div class="round">
<div class="round-title">R32</div>
<div id="r32-left"></div>
</div>

<div class="round">
<div class="round-title">R16</div>
<div id="r16-left"></div>
</div>

<div class="round">
<div class="round-title">QF</div>
<div id="qf-left"></div>
</div>

<div class="round">
<div class="round-title">SF</div>
<div id="sf-left"></div>
</div>

<div class="center-stage">

<div id="final-box"></div>

<div id="third-box"></div>

</div>

<div class="round">
<div class="round-title">SF</div>
<div id="sf-right"></div>
</div>

<div class="round">
<div class="round-title">QF</div>
<div id="qf-right"></div>
</div>

<div class="round">
<div class="round-title">R16</div>
<div id="r16-right"></div>
</div>

<div class="round">
<div class="round-title">R32</div>
<div id="r32-right"></div>
</div>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
