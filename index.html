<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundial 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050816;
color:white;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#0f2a68 0%,transparent 30%),
radial-gradient(circle at bottom right,#072b18 0%,transparent 30%);
opacity:.7;
z-index:-1;
}

.header{
height:90px;
border-bottom:1px solid rgba(255,255,255,.08);
display:flex;
align-items:center;
padding:0 40px;
background:rgba(0,0,0,.25);
backdrop-filter:blur(10px);
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo h1{
font-size:2.2rem;
}

.logo span{
color:#39ff88;
}

.main{
display:flex;
min-height:calc(100vh - 90px);
}

.sidebar{
width:260px;
border-right:1px solid rgba(255,255,255,.08);
padding:20px;
overflow-y:auto;
height:calc(100vh - 90px);
}

.sidebar h2{
margin-bottom:20px;
color:#bdbdbd;
font-size:1rem;
}

.grupo-btn{
background:#0d1734;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
padding:15px;
margin-bottom:14px;
cursor:pointer;
transition:.25s;
display:flex;
align-items:center;
gap:12px;
font-weight:600;
}

.grupo-btn:hover{
transform:translateX(5px);
border-color:#39ff88;
}

.grupo-btn.active{
background:linear-gradient(90deg,#114c28,#17351d);
border-color:#39ff88;
}

.circle{
width:32px;
height:32px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
color:white;
}

.content{
flex:1;
padding:35px;
}

.panel{
background:rgba(8,12,25,.9);
border:1px solid rgba(255,255,255,.06);
border-radius:24px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.group-title{
font-size:3rem;
color:#5cff7f;
margin-bottom:25px;
}

.group-teams{
display:flex;
gap:25px;
margin-bottom:30px;
flex-wrap:wrap;
}

.team-chip{
display:flex;
align-items:center;
gap:10px;
font-size:1.1rem;
}

.flag{
width:34px;
border-radius:4px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.matches,
.table-card{
background:#091127;
border:1px solid rgba(255,255,255,.06);
border-radius:20px;
padding:25px;
}

.section-title{
font-size:1.5rem;
margin-bottom:20px;
color:#f1f1f1;
}

.match{
background:#111b35;
border-radius:14px;
padding:14px;
margin-bottom:14px;
display:flex;
align-items:center;
justify-content:space-between;
}

.team{
width:180px;
display:flex;
align-items:center;
gap:10px;
}

.score-box{
display:flex;
align-items:center;
gap:10px;
}

input{
width:60px;
height:46px;
border:none;
border-radius:12px;
background:#0a1227;
border:2px solid #1e365e;
color:white;
text-align:center;
font-size:1.1rem;
transition:.2s;
}

input:focus{
outline:none;
border-color:#39ff88;
box-shadow:0 0 10px rgba(57,255,136,.4);
}

.vs{
font-weight:700;
color:#ccc;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#16233f;
padding:14px;
font-size:.95rem;
color:#ddd;
}

td{
padding:16px 10px;
border-bottom:1px solid rgba(255,255,255,.06);
text-align:center;
}

.rank{
width:50px;
font-weight:700;
}

.team-row{
display:flex;
align-items:center;
gap:10px;
}

.qualify{
border-left:4px solid #39ff88;
}

.third{
border-left:4px solid #4f8cff;
}

.classified{
margin-top:25px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.class-box{
background:#111c36;
border-radius:18px;
padding:20px;
}

.gold{
color:#ffd54f;
}

.green{
color:#5cff7f;
}

.blue{
color:#6aa7ff;
}

.knockout-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
margin-top:20px;
}

.knockout-match{
background:#111b35;
border-radius:16px;
padding:18px;
border:1px solid rgba(255,255,255,.06);
}

.knockout-title{
margin-bottom:15px;
font-size:1rem;
color:#5cff7f;
font-weight:600;
}

.knockout-team{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:12px;
background:#0a1227;
padding:10px;
border-radius:10px;
}

.footer{
text-align:center;
padding:30px;
opacity:.7;
}

@media(max-width:1200px){

.grid{
grid-template-columns:1fr;
}

}

@media(max-width:900px){

.main{
flex-direction:column;
}

.sidebar{
width:100%;
height:auto;
border-right:none;
border-bottom:1px solid rgba(255,255,255,.08);
}

.classified{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="header">

<div class="logo">
<div style="font-size:3rem;">🏆</div>

<div>
<h1>MUNDIAL <span>2026</span></h1>
<div>FASE DE GRUPOS</div>
</div>

</div>

</div>

<div class="main">

<div class="sidebar">

<h2>GRUPOS</h2>

<div id="sidebar-groups"></div>

</div>

<div class="content">

<div class="panel">

<div class="group-title"></div>

<div class="group-teams"></div>

<div class="grid">

<div class="matches">

<div class="section-title">
⚽ PARTIDOS
</div>

<div id="matches"></div>

</div>

<div class="table-card">

<div class="section-title">
📊 TABLA DE POSICIONES
</div>

<table>

<thead>

<tr>
<th>#</th>
<th>Equipo</th>
<th>PTS</th>
<th>GF</th>
<th>GC</th>
<th>DG</th>
</tr>

</thead>

<tbody id="tabla"></tbody>

</table>

</div>

</div>

<div class="classified">

<div class="class-box">
<h3 class="gold">🥇 1° Clasificado</h3>
<div id="first"></div>
</div>

<div class="class-box">
<h3 class="green">🥈 2° Clasificado</h3>
<div id="second"></div>
</div>

<div class="class-box">
<h3 class="blue">🥉 Mejor tercero</h3>
<div id="third"></div>
</div>

</div>

<div style="margin-top:60px;">

<div class="section-title">
🏆 FASE FINAL
</div>

<div class="table-card">

<h2>Dieciseisavos</h2>
<div id="dieciseisavos" class="knockout-grid"></div>

<h2 style="margin-top:40px;">Octavos</h2>
<div id="octavos" class="knockout-grid"></div>

<h2 style="margin-top:40px;">Cuartos</h2>
<div id="cuartos" class="knockout-grid"></div>

<h2 style="margin-top:40px;">Semifinales</h2>
<div id="semis" class="knockout-grid"></div>

<h2 style="margin-top:40px;">Tercer Puesto</h2>
<div id="tercer" class="knockout-grid"></div>

<h2 style="margin-top:40px;">Final</h2>
<div id="final" class="knockout-grid"></div>

</div>

</div>

</div>

</div>

</div>

<div class="footer">
Mundial 2026 — Hecho para los fanáticos del fútbol ❤️
</div>

<script>

const groups = {

A:{
color:"#26a65b",
teams:[
["México","https://flagcdn.com/w40/mx.png"],
["Sudáfrica","https://flagcdn.com/w40/za.png"],
["Corea del Sur","https://flagcdn.com/w40/kr.png"],
["República Checa","https://flagcdn.com/w40/cz.png"]
]
},

B:{
color:"#e74c3c",
teams:[
["Canadá","https://flagcdn.com/w40/ca.png"],
["Bosnia","https://flagcdn.com/w40/ba.png"],
["Qatar","https://flagcdn.com/w40/qa.png"],
["Suiza","https://flagcdn.com/w40/ch.png"]
]
},

C:{
color:"#f39c12",
teams:[
["Brasil","https://flagcdn.com/w40/br.png"],
["Marruecos","https://flagcdn.com/w40/ma.png"],
["Haití","https://flagcdn.com/w40/ht.png"],
["Escocia","https://flagcdn.com/w40/gb-sct.png"]
]
},

D:{
color:"#c0392b",
teams:[
["Estados Unidos","https://flagcdn.com/w40/us.png"],
["Paraguay","https://flagcdn.com/w40/py.png"],
["Australia","https://flagcdn.com/w40/au.png"],
["Turquía","https://flagcdn.com/w40/tr.png"]
]
},

E:{
color:"#27ae60",
teams:[
["Alemania","https://flagcdn.com/w40/de.png"],
["Curazao","https://flagcdn.com/w40/cw.png"],
["Costa de Marfil","https://flagcdn.com/w40/ci.png"],
["Ecuador","https://flagcdn.com/w40/ec.png"]
]
},

F:{
color:"#2e86de",
teams:[
["Países Bajos","https://flagcdn.com/w40/nl.png"],
["Japón","https://flagcdn.com/w40/jp.png"],
["Suecia","https://flagcdn.com/w40/se.png"],
["Túnez","https://flagcdn.com/w40/tn.png"]
]
},

G:{
color:"#f1c40f",
teams:[
["Bélgica","https://flagcdn.com/w40/be.png"],
["Egipto","https://flagcdn.com/w40/eg.png"],
["Irlanda","https://flagcdn.com/w40/ie.png"],
["Venezuela","https://flagcdn.com/w40/ve.png"]
]
},

H:{
color:"#ff0033",
teams:[
["España","https://flagcdn.com/w40/es.png"],
["Uruguay","https://flagcdn.com/w40/uy.png"],
["Arabia Saudita","https://flagcdn.com/w40/sa.png"],
["Cabo Verde","https://flagcdn.com/w40/cv.png"]
]
},

I:{
color:"#6c5ce7",
teams:[
["Francia","https://flagcdn.com/w40/fr.png"],
["Irak","https://flagcdn.com/w40/iq.png"],
["Dinamarca","https://flagcdn.com/w40/dk.png"],
["Camerún","https://flagcdn.com/w40/cm.png"]
]
},

J:{
color:"#0984e3",
teams:[
["Argentina","https://flagcdn.com/w40/ar.png"],
["Austria","https://flagcdn.com/w40/at.png"],
["Jordania","https://flagcdn.com/w40/jo.png"],
["Nigeria","https://flagcdn.com/w40/ng.png"]
]
},

K:{
color:"#6c5ce7",
teams:[
["Italia","https://flagcdn.com/w40/it.png"],
["Colombia","https://flagcdn.com/w40/co.png"],
["Noruega","https://flagcdn.com/w40/no.png"],
["Nueva Zelanda","https://flagcdn.com/w40/nz.png"]
]
},

L:{
color:"#e67e22",
teams:[
["Inglaterra","https://flagcdn.com/w40/gb-eng.png"],
["Croacia","https://flagcdn.com/w40/hr.png"],
["Ghana","https://flagcdn.com/w40/gh.png"],
["Panamá","https://flagcdn.com/w40/pa.png"]
]
}

};

const matchesData = [
[0,1],
[2,3],
[0,2],
[1,3],
[0,3],
[1,2]
];

let currentGroup = "A";

const sidebar = document.getElementById("sidebar-groups");

Object.keys(groups).forEach(key=>{

sidebar.innerHTML += `

<div class="grupo-btn ${key==="A" ? "active" : ""}" onclick="loadGroup('${key}')" data-group="${key}">

<div class="circle" style="background:${groups[key].color};">
${key}
</div>

Grupo ${key}

</div>

`;

});

function loadGroup(groupKey){

currentGroup = groupKey;

document.querySelectorAll(".grupo-btn").forEach(btn=>{
btn.classList.remove("active");
});

document.querySelector(`[data-group="${groupKey}"]`)
.classList.add("active");

document.querySelector(".group-title")
.innerHTML = `Grupo ${groupKey}`;

const teamsContainer = document.querySelector(".group-teams");

teamsContainer.innerHTML = "";

groups[groupKey].teams.forEach(team=>{

teamsContainer.innerHTML += `

<div class="team-chip">
<img class="flag" src="${team[1]}">
${team[0]}
</div>

`;

});

const matchesDiv = document.getElementById("matches");

matchesDiv.innerHTML = "";

matchesData.forEach((m,index)=>{

matchesDiv.innerHTML += `

<div class="match">

<div class="team">
<img class="flag" src="${groups[groupKey].teams[m[0]][1]}">
${groups[groupKey].teams[m[0]][0]}
</div>

<div class="score-box">

<input type="number" min="0" id="a${index}">
<div class="vs">VS</div>
<input type="number" min="0" id="b${index}">

</div>

<div class="team">
<img class="flag" src="${groups[groupKey].teams[m[1]][1]}">
${groups[groupKey].teams[m[1]][0]}
</div>

</div>

`;

});

document.querySelectorAll("input").forEach(input=>{

input.addEventListener("keyup",e=>{

if(e.key==="Enter"){
updateTable();
}

});

});

updateTable();

}

function updateTable(){

let stats = {};

groups[currentGroup].teams.forEach(t=>{

stats[t[0]] = {
pts:0,
gf:0,
gc:0,
dg:0,
flag:t[1]
};

});

matchesData.forEach((m,index)=>{

let a = document.getElementById(`a${index}`).value;
let b = document.getElementById(`b${index}`).value;

if(a==="" || b==="") return;

a = parseInt(a);
b = parseInt(b);

const teamA = groups[currentGroup].teams[m[0]][0];
const teamB = groups[currentGroup].teams[m[1]][0];

stats[teamA].gf += a;
stats[teamA].gc += b;

stats[teamB].gf += b;
stats[teamB].gc += a;

if(a>b){

stats[teamA].pts += 3;

}

else if(b>a){

stats[teamB].pts += 3;

}

else{

stats[teamA].pts += 1;
stats[teamB].pts += 1;

}

});

Object.keys(stats).forEach(team=>{

stats[team].dg = stats[team].gf - stats[team].gc;

});

const sorted = Object.keys(stats).sort((a,b)=>{

if(stats[b].pts !== stats[a].pts)
return stats[b].pts - stats[a].pts;

if(stats[b].dg !== stats[a].dg)
return stats[b].dg - stats[a].dg;

return stats[b].gf - stats[a].gf;

});

const tbody = document.getElementById("tabla");

tbody.innerHTML = "";

sorted.forEach((team,index)=>{

tbody.innerHTML += `

<tr class="${index<2 ? 'qualify' : index===2 ? 'third' : ''}">

<td class="rank">${index+1}</td>

<td>

<div class="team-row">
<img class="flag" src="${stats[team].flag}">
${team}
</div>

</td>

<td>${stats[team].pts}</td>
<td>${stats[team].gf}</td>
<td>${stats[team].gc}</td>
<td>${stats[team].dg}</td>

</tr>

`;

});

document.getElementById("first").innerHTML = sorted[0];
document.getElementById("second").innerHTML = sorted[1];
document.getElementById("third").innerHTML = sorted[2];

}

function createKnockout(id,title,count){

const container = document.getElementById(id);

for(let i=1;i<=count;i++){

container.innerHTML += `

<div class="knockout-match">

<div class="knockout-title">
${title} ${i}
</div>

<div class="knockout-team">
<div>Equipo 1</div>
<input type="number" class="knockout-score">
</div>

<div class="knockout-team">
<div>Equipo 2</div>
<input type="number" class="knockout-score">
</div>

</div>

`;

}

}

createKnockout("dieciseisavos","Partido",8);
createKnockout("octavos","Octavo",8);
createKnockout("cuartos","Cuarto",4);
createKnockout("semis","Semifinal",2);

document.getElementById("tercer").innerHTML = `

<div class="knockout-match">

<div class="knockout-title">
🥉 Tercer Puesto
</div>

<div class="knockout-team">
<div>Semifinalista 1</div>
<input type="number" class="knockout-score">
</div>

<div class="knockout-team">
<div>Semifinalista 2</div>
<input type="number" class="knockout-score">
</div>

</div>

`;

document.getElementById("final").innerHTML = `

<div class="knockout-match">

<div class="knockout-title">
🏆 FINAL
</div>

<div class="knockout-team">
<div>Finalista 1</div>
<input type="number" class="knockout-score">
</div>

<div class="knockout-team">
<div>Finalista 2</div>
<input type="number" class="knockout-score">
</div>

</div>

`;

loadGroup("A");

</script>

</body>
</html>
