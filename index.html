<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mundial 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050816;
    color:white;
    overflow-x:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#0f2a68 0%,transparent 30%),
    radial-gradient(circle at bottom right,#072b18 0%,transparent 30%);
    opacity:.7;
    z-index:-1;
}

.header{
    height:90px;
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(10px);
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo h1{
    font-size:2.2rem;
}

.logo span{
    color:#39ff88;
}

.live{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:1rem;
}

.dot{
    width:12px;
    height:12px;
    background:#39ff88;
    border-radius:50%;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:.4;}
    100%{opacity:1;}
}

.main{
    display:flex;
    min-height:calc(100vh - 90px);
}

.sidebar{
    width:260px;
    border-right:1px solid rgba(255,255,255,.08);
    padding:20px;
}

.sidebar h2{
    margin-bottom:20px;
    color:#bdbdbd;
    font-size:1rem;
}

.grupo-btn{
    background:#0d1734;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:15px;
    margin-bottom:14px;
    cursor:pointer;
    transition:.25s;
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:600;
}

.grupo-btn:hover{
    transform:translateX(5px);
    border-color:#39ff88;
}

.grupo-btn.active{
    background:linear-gradient(90deg,#114c28,#17351d);
    border-color:#39ff88;
}

.circle{
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:white;
}

.content{
    flex:1;
    padding:35px;
}

.panel{
    background:rgba(8,12,25,.9);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.group-title{
    font-size:3rem;
    color:#5cff7f;
    margin-bottom:25px;
}

.group-teams{
    display:flex;
    gap:25px;
    margin-bottom:30px;
    flex-wrap:wrap;
}

.team-chip{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:1.1rem;
}

.flag{
    width:34px;
    border-radius:4px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.matches,
.table-card{
    background:#091127;
    border:1px solid rgba(255,255,255,.06);
    border-radius:20px;
    padding:25px;
}

.section-title{
    font-size:1.5rem;
    margin-bottom:20px;
    color:#f1f1f1;
}

.match{
    background:#111b35;
    border-radius:14px;
    padding:14px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.team{
    width:180px;
    display:flex;
    align-items:center;
    gap:10px;
}

.score-box{
    display:flex;
    align-items:center;
    gap:10px;
}

input{
    width:60px;
    height:46px;
    border:none;
    border-radius:12px;
    background:#0a1227;
    border:2px solid #1e365e;
    color:white;
    text-align:center;
    font-size:1.1rem;
    transition:.2s;
}

input:focus{
    outline:none;
    border-color:#39ff88;
    box-shadow:0 0 10px rgba(57,255,136,.4);
}

.vs{
    font-weight:700;
    color:#ccc;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#16233f;
    padding:14px;
    font-size:.95rem;
    color:#ddd;
}

td{
    padding:16px 10px;
    border-bottom:1px solid rgba(255,255,255,.06);
    text-align:center;
}

.rank{
    width:50px;
    font-weight:700;
}

.team-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.qualify{
    border-left:4px solid #39ff88;
}

.third{
    border-left:4px solid #4f8cff;
}

.classified{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.class-box{
    background:#111c36;
    border-radius:18px;
    padding:20px;
}

.class-box h3{
    margin-bottom:10px;
}

.gold{
    color:#ffd54f;
}

.green{
    color:#5cff7f;
}

.blue{
    color:#6aa7ff;
}

.footer{
    text-align:center;
    padding:30px;
    opacity:.7;
}

@media(max-width:1200px){

    .grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:900px){

    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:1px solid rgba(255,255,255,.08);
    }

    .classified{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="header">

    <div class="logo">
        <div style="font-size:3rem;">🏆</div>

        <div>
            <h1>MUNDIAL <span>2026</span></h1>
            <div>FASE DE GRUPOS</div>
        </div>
    </div>

    <div class="live">
        <div class="dot"></div>
        En vivo
    </div>

</div>

<div class="main">

    <div class="sidebar">

        <h2>GRUPOS</h2>

        <div class="grupo-btn active">
            <div class="circle" style="background:#26a65b;">🇲🇽</div>
            Grupo A
        </div>

    </div>

    <div class="content">

        <div class="panel">

            <div class="group-title">
                Grupo A
            </div>

            <div class="group-teams">

                <div class="team-chip">
                    <img class="flag" src="https://flagcdn.com/w40/mx.png">
                    México
                </div>

                <div class="team-chip">
                    <img class="flag" src="https://flagcdn.com/w40/za.png">
                    Sudáfrica
                </div>

                <div class="team-chip">
                    <img class="flag" src="https://flagcdn.com/w40/kr.png">
                    Corea del Sur
                </div>

                <div class="team-chip">
                    <img class="flag" src="https://flagcdn.com/w40/cz.png">
                    República Checa
                </div>

            </div>

            <div class="grid">

                <div class="matches">

                    <div class="section-title">
                        ⚽ PARTIDOS
                    </div>

                    <div id="matches"></div>

                </div>

                <div class="table-card">

                    <div class="section-title">
                        📊 TABLA DE POSICIONES
                    </div>

                    <table>

                        <thead>

                            <tr>
                                <th>#</th>
                                <th>Equipo</th>
                                <th>PTS</th>
                                <th>GF</th>
                                <th>GC</th>
                                <th>DG</th>
                            </tr>

                        </thead>

                        <tbody id="tabla"></tbody>

                    </table>

                </div>

            </div>

            <div class="classified">

                <div class="class-box">
                    <h3 class="gold">🥇 1° Clasificado</h3>
                    <div id="first"></div>
                </div>

                <div class="class-box">
                    <h3 class="green">🥈 2° Clasificado</h3>
                    <div id="second"></div>
                </div>

                <div class="class-box">
                    <h3 class="blue">🥉 Mejor tercero</h3>
                    <div id="third"></div>
                </div>

            </div>

        </div>

    </div>

</div>

<div class="footer">
    Mundial 2026 — Hecho para los fanáticos del fútbol ❤️
</div>

<script>

const teams = [

{
    name:"México",
    flag:"https://flagcdn.com/w40/mx.png"
},

{
    name:"Sudáfrica",
    flag:"https://flagcdn.com/w40/za.png"
},

{
    name:"Corea del Sur",
    flag:"https://flagcdn.com/w40/kr.png"
},

{
    name:"República Checa",
    flag:"https://flagcdn.com/w40/cz.png"
}

];

const matchesData = [

[0,1],
[2,3],
[0,2],
[1,3],
[0,3],
[1,2]

];

const matchesDiv = document.getElementById("matches");

matchesData.forEach((m,index)=>{

    matchesDiv.innerHTML += `

    <div class="match">

        <div class="team">
            <img class="flag" src="${teams[m[0]].flag}">
            ${teams[m[0]].name}
        </div>

        <div class="score-box">

            <input type="number" min="0" id="a${index}">
            <div class="vs">VS</div>
            <input type="number" min="0" id="b${index}">

        </div>

        <div class="team">
            <img class="flag" src="${teams[m[1]].flag}">
            ${teams[m[1]].name}
        </div>

    </div>

    `;

});

document.querySelectorAll("input").forEach(input=>{

    input.addEventListener("keyup",e=>{

        if(e.key==="Enter"){
            updateTable();
        }

    });

});

function updateTable(){

    let stats = {};

    teams.forEach(t=>{

        stats[t.name] = {
            pts:0,
            gf:0,
            gc:0,
            dg:0,
            flag:t.flag
        };

    });

    matchesData.forEach((m,index)=>{

        let a = document.getElementById(`a${index}`).value;
        let b = document.getElementById(`b${index}`).value;

        if(a==="" || b==="") return;

        a = parseInt(a);
        b = parseInt(b);

        const teamA = teams[m[0]].name;
        const teamB = teams[m[1]].name;

        stats[teamA].gf += a;
        stats[teamA].gc += b;

        stats[teamB].gf += b;
        stats[teamB].gc += a;

        if(a>b){

            stats[teamA].pts += 3;

        }

        else if(b>a){

            stats[teamB].pts += 3;

        }

        else{

            stats[teamA].pts += 1;
            stats[teamB].pts += 1;

        }

    });

    Object.keys(stats).forEach(team=>{

        stats[team].dg = stats[team].gf - stats[team].gc;

    });

    const sorted = Object.keys(stats).sort((a,b)=>{

        if(stats[b].pts !== stats[a].pts)
            return stats[b].pts - stats[a].pts;

        if(stats[b].dg !== stats[a].dg)
            return stats[b].dg - stats[a].dg;

        return stats[b].gf - stats[a].gf;

    });

    const tbody = document.getElementById("tabla");

    tbody.innerHTML = "";

    sorted.forEach((team,index)=>{

        tbody.innerHTML += `

        <tr class="${index<2 ? 'qualify' : index===2 ? 'third' : ''}">

            <td class="rank">${index+1}</td>

            <td>

                <div class="team-row">
                    <img class="flag" src="${stats[team].flag}">
                    ${team}
                </div>

            </td>

            <td>${stats[team].pts}</td>
            <td>${stats[team].gf}</td>
            <td>${stats[team].gc}</td>
            <td>${stats[team].dg}</td>

        </tr>

        `;

    });

    document.getElementById("first").innerHTML = sorted[0];
    document.getElementById("second").innerHTML = sorted[1];
    document.getElementById("third").innerHTML = sorted[2];

}

updateTable();

</script>

</body>
</html>
