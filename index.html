<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundial 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🏆</div>
      <div>
        <h1>MUNDIAL <span>2026</span></h1>
        <p>fase de grupos y fase final</p>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h2 class="sidebar-title">GRUPOS</h2>
        <div id="groups-menu"></div>
      </div>

      <div class="sidebar-section sidebar-phase">
        <h2 class="sidebar-title">FASE FINAL</h2>

        <div class="bracket-shell">
          <div class="round">
            <h3 class="round-title">Dieciseisavos</h3>
            <div class="round-pair">
              <div id="r32-left" class="round-column"></div>
              <div id="r32-right" class="round-column"></div>
            </div>
          </div>

          <div class="round">
            <h3 class="round-title">Octavos</h3>
            <div class="round-pair">
              <div id="r16-left" class="round-column"></div>
              <div id="r16-right" class="round-column"></div>
            </div>
          </div>

          <div class="round">
            <h3 class="round-title">Cuartos</h3>
            <div class="round-pair center-round">
              <div id="qf-left" class="round-column"></div>
              <div id="qf-right" class="round-column"></div>
            </div>
          </div>

          <div class="round">
            <h3 class="round-title">Semifinales</h3>
            <div class="round-pair">
              <div id="sf-left" class="round-column"></div>
              <div id="sf-right" class="round-column"></div>
            </div>
          </div>

          <div class="round center-stage">
            <h3 class="round-title">Tercer puesto</h3>
            <div id="third-box"></div>
            <h3 class="round-title" style="margin-top: 18px;">Final</h3>
            <div id="final-box"></div>
          </div>
        </div>
      </div>
    </aside>

    <section class="content">
      <div class="panel">
        <div class="group-title" id="group-title">Grupo A</div>
        <div class="group-teams" id="group-teams"></div>

        <div class="top-grid">
          <div class="card">
            <div class="section-title">⚽ Partidos</div>
            <div id="matches"></div>
          </div>

          <div class="card">
            <div class="section-title">📊 Tabla de posiciones</div>
            <table class="table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Equipo</th>
                  <th>PTS</th>
                  <th>GF</th>
                  <th>GC</th>
                  <th>DG</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </div>

        <div class="info-note">
          Presiona <strong>Enter</strong> en cualquier resultado para actualizar tablas y llaves.
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
